<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BattleTrack | CF-015.1 Comparison Read-only Test</title><link rel="stylesheet" href="/battletrack.css"><style>body{background:#0d101b;color:#e8edf5;font-family:system-ui,sans-serif}.shell{max-width:1100px;margin:35px auto;padding:20px}.panel{padding:25px;border:1px solid #8c713c;border-radius:12px;background:#111e2b}h1{color:#e9c37a}select,button{padding:10px;background:#172638;color:#fff;border:1px solid #b18d48;border-radius:6px}button{cursor:pointer}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:8px;border-bottom:1px solid #344658;text-align:left}th{color:#e9c37a}.scroll{overflow:auto;max-height:60vh}small{color:#b8c8d8}#status{padding:12px 0}</style></head><body><main class="shell"><section class="panel"><h1>CF-015.1 · Leadership Comparison</h1><p>Read-only Cloudflare data verification. No imports, exports or database changes.</p><label for="kvk">Historical KvK</label> <select id="kvk" disabled><option>Loading…</option></select> <button id="load" disabled>LOAD COMPARISON</button><p id="status" role="status">Checking Officer + Data access…</p><div id="results" hidden><h2 id="heading"></h2><p id="summary"></p><div class="scroll"><table><thead><tr><th>Rank</th><th>Governor</th><th>ID</th><th>Start Power</th><th>KP</th><th>T4</th><th>T5</th><th>Deads</th><th>DKP</th><th>KPR</th><th>Requirement</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main><script>"use strict";const $=id=>document.getElementById(id),fmt=v=>Number(v||0).toLocaleString('en-US');let list=[];async function load(){const id=$('kvk').value;$('results').hidden=true;$('status').textContent='Loading signed comparison for '+id+'…';$('load').disabled=true;try{const response=await fetch('/api/v1/leadership/comparisons/'+encodeURIComponent(id),{credentials:'same-origin',cache:'no-store'});const payload=await response.json();if(!response.ok||!payload.ok||!payload.data?.ok)throw Error(payload.message||payload.data?.message||'HTTP '+response.status);const d=payload.data;if(d.kvk.id!==id||d.total!==d.rows.length)throw Error('Unexpected comparison response');$('heading').textContent='KvK '+d.kvk.number+' · '+d.kvk.seasonName;$('summary').textContent=d.total+' Governors · '+d.kvk.comparisonMode+' · '+d.kvk.startDate+' → '+(d.kvk.endDate||'LATEST');const body=$('rows');body.replaceChildren();for(const r of d.rows){const tr=document.createElement('tr');for(const val of [r.dkpRank,r.governorName,r.governorId,r.startPower,r.killPoints,r.t4Kills,r.t5Kills,r.deads,r.dkp,r.kpr===null?'—':(r.kpr*100).toFixed(2)+'%',r.requirementStatus]){const td=document.createElement('td');td.textContent=typeof val==='number'&&Number.isInteger(val)?fmt(val):String(val??'—');tr.append(td)}body.append(tr)}$('results').hidden=false;$('status').textContent='Comparison loaded via signed read-only bridge. No changes saved.'}catch(e){$('status').textContent='Comparison not loaded: '+e.message}finally{$('load').disabled=false}}(async()=>{try{const r=await fetch('/api/v1/leadership/kvks',{credentials:'same-origin',cache:'no-store'});if(!r.ok)throw Error('Officer + Data access required (HTTP '+r.status+')');const p=await r.json();if(!p.ok||!p.data?.ok)throw Error('KvK list unavailable');list=p.data.kvks;$('kvk').replaceChildren();for(const k of list){const o=document.createElement('option');o.value=k.id;o.textContent='KvK '+k.number+' · '+k.seasonName;$('kvk').append(o)}$('kvk').disabled=false;$('load').disabled=false;$('status').textContent='Select a KvK and load its actual comparison.'}catch(e){$('status').textContent=e.message}})();$('load').addEventListener('click',load);</script></body></html>
