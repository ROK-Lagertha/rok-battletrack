<style>
:root{
  --bg:#07101d;--panel:#0d1929;--panel2:#111f32;--line:#26364c;
  --gold:#d8ad5a;--gold2:#f0cf83;--text:#f3f5f8;--muted:#8f9bad;
  --green:#5fd49a;--red:#ef7373;--blue:#75aef2;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:
radial-gradient(circle at 85% 0%,rgba(216,173,90,.10),transparent 28%),
linear-gradient(180deg,#07101d,#091421 70%);color:var(--text);
font-family:Inter,Segoe UI,Arial,sans-serif}
.shell{width:min(1180px,calc(100% - 32px));margin:auto;padding:46px 0 80px}
.hero{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.hero h1{font-size:clamp(2.2rem,6vw,4.6rem);margin:3px 0 2px;letter-spacing:-.045em}
.hero h1 span{color:var(--gold)}
.hero p,.muted{color:var(--muted)}
.kicker{color:var(--gold);font-size:.72rem;font-weight:800;letter-spacing:.18em}
.crest{font-size:3.6rem;color:var(--gold);opacity:.8}
.search-panel,.player-card,.panel,.stat{background:rgba(13,25,41,.88);border:1px solid var(--line);
box-shadow:0 18px 50px rgba(0,0,0,.18)}
.search-panel{padding:22px;border-radius:18px;margin-bottom:22px}
.search-panel label{display:block;color:var(--gold2);font-size:.78rem;font-weight:800;letter-spacing:.12em;margin-bottom:10px}
.search-row{display:flex;gap:10px}
input{flex:1;min-width:0;background:#07111f;border:1px solid #34445b;color:white;padding:15px 16px;
border-radius:10px;font-size:1rem;outline:none}
input:focus{border-color:var(--gold)}
button{border:0;border-radius:10px;padding:0 25px;background:linear-gradient(135deg,var(--gold2),var(--gold));
color:#111827;font-weight:900;letter-spacing:.08em;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.message{min-height:20px;margin-top:10px;color:var(--muted);font-size:.9rem}
.message.error{color:var(--red)}
.player-card{display:flex;justify-content:space-between;align-items:center;padding:25px;border-radius:18px}
.player-card h2{font-size:2rem;margin:5px 0}
.status-pill{padding:9px 13px;border:1px solid var(--line);border-radius:999px;font-size:.78rem;font-weight:900}
.status-pill.pass{color:var(--green);border-color:rgba(95,212,154,.4)}
.status-pill.not-met{color:var(--red);border-color:rgba(239,115,115,.4)}
.status-pill.in-progress{color:var(--blue);border-color:rgba(117,174,242,.4)}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:12px 0}
.stat{padding:18px;border-radius:14px}.stat span,.metric span{display:block;color:var(--muted);font-size:.78rem}
.stat strong{display:block;font-size:1.55rem;margin-top:7px}
.panel{padding:24px;border-radius:18px;margin-top:12px}
.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}
.section-head h3{margin:4px 0 0;font-size:1.35rem}
.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.metric{background:var(--panel2);border:1px solid var(--line);padding:16px;border-radius:12px}
.metric strong{display:block;margin-top:7px;font-size:1.25rem}
.progress-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.progress-card{background:var(--panel2);border:1px solid var(--line);padding:15px;border-radius:12px}
.progress-label{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.8rem;margin-bottom:9px}
.progress-label b{color:var(--text)}
.bar{height:7px;background:#07111f;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:999px}
.history{display:grid;gap:9px}
.history-row{display:grid;grid-template-columns:90px 1fr 150px 140px;gap:12px;align-items:center;
background:var(--panel2);border:1px solid var(--line);padding:14px;border-radius:12px}
.history-row .kvk{font-weight:900;color:var(--gold2)}
.history-row .result{font-weight:800}
.history-row .result.PASS{color:var(--green)}.history-row .result.NOT_MET{color:var(--red)}
.history-row .result.IN_PROGRESS{color:var(--blue)}
@media(max-width:760px){
 .shell{width:min(100% - 20px,1180px);padding-top:25px}.crest{display:none}
 .search-row{flex-direction:column}button{padding:15px}
 .player-card{align-items:flex-start;gap:15px;flex-direction:column}
 .stats-grid{grid-template-columns:repeat(2,1fr)}
 .metric-grid,.progress-grid{grid-template-columns:1fr}
 .history-row{grid-template-columns:70px 1fr}.history-row>:nth-child(3),.history-row>:nth-child(4){grid-column:2}
}
</style>
