<style>
:root{
  --black:#030405;--navy:#07111d;--navy2:#0b1725;--panel:#0c1724;
  --gold:#f0a51b;--gold-bright:#ffd36b;--gold-soft:#c57a0c;
  --silver:#e6e8ea;--text:#f4f2ec;--muted:#8e99a7;
  --line:rgba(240,165,27,.25);--green:#66d89c;--red:#ef7373;--blue:#78b6ff;
}
*{box-sizing:border-box}
html{background:var(--black)}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:Inter,Segoe UI,Arial,sans-serif;
  background:
    radial-gradient(circle at 50% 8%,rgba(238,150,18,.10),transparent 24rem),
    linear-gradient(180deg,#020303 0%,#050a10 35%,#07111d 100%);
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:linear-gradient(to bottom,transparent,black 25%,black 80%,transparent);
}
.page-shell{width:min(1180px,calc(100% - 28px));margin:auto;padding-bottom:55px}
.battletrack-hero{position:relative;display:flex;flex-direction:column;align-items:center;min-height:auto;padding:14px 0 28px;overflow:hidden}
.ambient{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none}
.ambient-one{width:300px;height:300px;background:rgba(237,146,13,.13);top:120px;left:15%}
.ambient-two{width:240px;height:240px;background:rgba(245,182,54,.09);top:260px;right:15%}
.logo-wrap{position:relative;width:min(980px,96vw);z-index:1}
.logo-wrap:after{content:"";position:absolute;inset:15% 16%;z-index:-1;border-radius:50%;box-shadow:0 0 110px 30px rgba(239,154,17,.18)}
.battletrack-logo{display:block;width:100%;height:auto;max-height:none;object-fit:contain;filter:drop-shadow(0 16px 30px rgba(0,0,0,.68))}
.hero-search{position:relative;z-index:2;width:min(650px,92vw);margin-top:2px;text-align:center}
.search-caption{margin-bottom:11px;color:var(--gold-bright);font-size:.72rem;font-weight:900;letter-spacing:.22em;text-shadow:0 0 18px rgba(240,165,27,.35)}
.search-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:7px;border:1px solid rgba(240,165,27,.30);border-radius:14px;background:rgba(4,9,15,.88);box-shadow:0 10px 35px rgba(0,0,0,.35),0 0 30px rgba(240,165,27,.05)}
input{min-width:0;border:0;outline:0;border-radius:9px;background:#08121e;color:white;padding:15px 16px;font-size:1rem;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
input:focus{box-shadow:inset 0 0 0 1px rgba(255,199,78,.55),0 0 20px rgba(240,165,27,.08)}
button{border:1px solid #ffc75a;border-radius:9px;padding:0 22px;min-height:49px;background:linear-gradient(180deg,#ffd675,#d88a0b);color:#171006;font-weight:950;letter-spacing:.08em;cursor:pointer;box-shadow:inset 0 1px rgba(255,255,255,.55),0 0 18px rgba(240,165,27,.16)}
button:hover{filter:brightness(1.06);box-shadow:inset 0 1px rgba(255,255,255,.65),0 0 25px rgba(240,165,27,.28)}
button:disabled{opacity:.55;cursor:wait}
.message{min-height:22px;margin-top:10px;color:var(--muted);font-size:.9rem}
.message.error{color:var(--red)}
.hero-divider{display:flex;align-items:center;width:min(520px,80vw);gap:14px;margin-top:22px;color:var(--gold)}
.hero-divider:before,.hero-divider:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--gold-soft),transparent)}
.hero-divider span{font-size:.65rem;text-shadow:0 0 14px var(--gold)}
#dashboard{padding-top:28px}
.player-card,.panel,.stat{
  background:linear-gradient(145deg,rgba(12,23,36,.96),rgba(6,13,22,.96));
  border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.025)
}
.player-card{display:flex;justify-content:space-between;align-items:center;padding:25px 27px;border-radius:16px;position:relative;overflow:hidden}
.player-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--gold-bright),var(--gold-soft));box-shadow:0 0 18px var(--gold)}
.player-card h2{font-family:Georgia,serif;font-size:2.2rem;margin:4px 0;color:#fff}
.kicker{color:var(--gold-bright);font-size:.68rem;font-weight:900;letter-spacing:.18em}
.muted{color:var(--muted)}
.status-pill{padding:9px 14px;border:1px solid var(--line);border-radius:999px;font-size:.76rem;font-weight:900;letter-spacing:.05em}
.status-pill.pass{color:var(--green);border-color:rgba(102,216,156,.38)}
.status-pill.not-met{color:var(--red);border-color:rgba(239,115,115,.38)}
.status-pill.in-progress{color:var(--blue);border-color:rgba(120,182,255,.38)}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}
.stat{padding:18px;border-radius:13px}.stat span,.metric span{display:block;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
.stat strong{display:block;font-size:1.5rem;margin-top:7px;color:var(--gold-bright)}
.panel{padding:24px;border-radius:16px;margin-top:10px}
.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px;padding-bottom:13px;border-bottom:1px solid rgba(240,165,27,.13)}
.section-head h3{font-family:Georgia,serif;margin:4px 0 0;font-size:1.45rem}
.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}

.metric strong{display:block;margin-top:7px;font-size:1.25rem}
.progress-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.progress-card{background:rgba(10,21,34,.85);border:1px solid rgba(255,255,255,.065);padding:15px;border-radius:11px}
.progress-label{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.78rem;margin-bottom:9px}
.progress-label b{color:var(--gold-bright)}
.requirement-detail{display:flex;flex-direction:column;gap:2px;min-height:34px;margin:-2px 0 9px;color:var(--muted);font-size:.72rem}
.requirement-detail strong{color:var(--text);font-size:.78rem;font-weight:700}
.requirement-detail span{color:var(--gold-soft)}

.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b96a04,#ffca4c,#fff0a0);border-radius:999px;box-shadow:0 0 12px rgba(255,185,48,.55)}
.history{display:grid;gap:8px}
.history-row{display:grid;grid-template-columns:90px 1fr 150px 140px;gap:12px;align-items:center;background:rgba(10,21,34,.82);border:1px solid rgba(255,255,255,.06);padding:14px;border-radius:11px}
.history-row:hover{border-color:rgba(240,165,27,.25)}
.history-row .kvk{font-weight:900;color:var(--gold-bright)}
.history-row .result{font-weight:900}.history-row .result.PASS{color:var(--green)}.history-row .result.NOT_MET{color:var(--red)}.history-row .result.IN_PROGRESS{color:var(--blue)}
footer{text-align:center;color:#596575;font-size:.65rem;font-weight:800;letter-spacing:.17em;margin-top:35px}
@media(max-width:760px){
 .page-shell{width:min(100% - 18px,1180px)}
 .hero-search{width:94vw}
 .search-row{grid-template-columns:1fr}.search-caption{font-size:.66rem}
 button{padding:14px}
 .player-card{align-items:flex-start;gap:15px;flex-direction:column}
 .stats-grid{grid-template-columns:repeat(2,1fr)}
 .metric-grid,.progress-grid{grid-template-columns:1fr}

}

.current-season-stat strong{font-size:clamp(.92rem,1.7vw,1.25rem);line-height:1.2}
.history-item{border:1px solid #17283a;border-radius:12px;background:rgba(8,19,31,.56);overflow:hidden}
.history-item+.history-item{margin-top:9px}

.history-toggle:focus-visible{outline:2px solid #ffbd2e;outline-offset:-2px}
.history-chevron{display:inline-block;margin-left:10px;color:#ffbd2e;font-size:1.1rem;transition:transform .2s ease}
.history-item.open .history-chevron{transform:rotate(180deg)}
.history-details{border-top:1px solid rgba(255,184,0,.15);padding:18px 16px 20px}
.history-detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.history-detail-card{padding:13px 14px;border:1px solid #17283a;border-radius:10px;background:#091624}

.history-progress-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}
.history-progress{padding:12px 14px;border:1px solid #17283a;border-radius:10px;background:#091624}
.history-progress>div:first-child{display:flex;justify-content:space-between;gap:12px;color:#88a9d5;font-size:.72rem}
.history-progress strong{color:#ffcf4d}
.history-progress small{display:block;color:#65778b;margin:5px 0 8px}

.history-more{display:block;width:100%;margin-top:11px;min-height:44px;background:rgba(10,21,34,.82);color:var(--gold-bright);border:1px solid rgba(240,165,27,.25);box-shadow:none;font-size:.72rem;letter-spacing:.12em}
.history-more:hover{background:rgba(240,165,27,.07);box-shadow:0 0 18px rgba(240,165,27,.08)}

@media(max-width:760px){
 .history-detail-grid,.history-progress-grid{grid-template-columns:1fr}
 .history-deads{white-space:nowrap}
}

.ranking-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.ranking-tabs{display:flex;gap:5px;flex-wrap:wrap}.ranking-tab{min-height:28px;padding:5px 10px;border-radius:7px;border:1px solid rgba(240,165,27,.22);background:rgba(3,10,18,.55);color:var(--muted);font-size:.64rem;font-weight:900;letter-spacing:.08em;box-shadow:none}.ranking-tab:hover{background:rgba(240,165,27,.08);color:var(--gold-bright);box-shadow:none}.ranking-tab.active{border-color:rgba(255,193,44,.7);background:rgba(240,165,27,.14);color:var(--gold-bright)}
.dkp-ranking-card{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:12px;padding:18px 20px;border:1px solid rgba(240,165,27,.32);border-radius:12px;background:linear-gradient(110deg,rgba(240,165,27,.08),rgba(10,21,34,.88) 45%,rgba(10,21,34,.88));box-shadow:inset 0 1px rgba(255,255,255,.025),0 0 24px rgba(240,165,27,.04)}
.dkp-rank-line{display:flex;align-items:baseline;gap:10px;margin-top:5px}.dkp-rank-percentile{margin-top:4px;color:var(--gold-soft);font-size:.72rem;font-weight:700;letter-spacing:.02em}.dkp-rank-line strong{font-family:Georgia,serif;font-size:2rem;color:var(--gold-bright);text-shadow:0 0 18px rgba(240,165,27,.18)}.dkp-rank-line span{color:var(--muted);font-size:.82rem}.dkp-score{text-align:right}.dkp-score span{display:block;color:var(--muted);font-size:.68rem;font-weight:800;letter-spacing:.12em}.dkp-score strong{display:block;margin-top:5px;font-size:1.25rem;color:var(--text)}
@media(max-width:760px){.ranking-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.ranking-tabs{display:flex;gap:5px;flex-wrap:wrap}.ranking-tab{min-height:28px;padding:5px 10px;border-radius:7px;border:1px solid rgba(240,165,27,.22);background:rgba(3,10,18,.55);color:var(--muted);font-size:.64rem;font-weight:900;letter-spacing:.08em;box-shadow:none}.ranking-tab:hover{background:rgba(240,165,27,.08);color:var(--gold-bright);box-shadow:none}.ranking-tab.active{border-color:rgba(255,193,44,.7);background:rgba(240,165,27,.14);color:var(--gold-bright)}
.dkp-ranking-card{align-items:flex-end}.dkp-rank-line{display:block}.dkp-rank-line span{display:block;margin-top:3px}.dkp-score strong{font-size:1.05rem}}

.ranking-neighborhood{flex-basis:100%;width:100%;margin-top:14px;padding-top:12px;border-top:1px solid rgba(240,165,27,.14);display:grid;gap:5px}
.ranking-neighbor{display:grid;grid-template-columns:54px minmax(0,1fr) auto;align-items:center;gap:10px;padding:7px 9px;border-radius:7px;color:var(--muted);font-size:.76rem;background:rgba(3,10,18,.28)}

.neighbor-rank{font-family:Georgia,serif;font-weight:700;color:var(--gold-soft)}
.neighbor-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.neighbor-name b{margin-left:6px;color:var(--gold-bright);font-size:.58rem;letter-spacing:.1em}

/* v1.4.4.1 - Collapsible ranking panel (native details/summary, closed by default) */

/* v1.5.0 - Full Kingdom Ranking */
